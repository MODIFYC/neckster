<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 220px;
            padding: 20px 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fffdf7;
            color: #333;
            text-align: center;
        }

        .hamster-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .status {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .status.active {
            color: #4caf50;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        button:hover { opacity: 0.85; }

        #btn-activate {
            background: #f5a623;
            color: #fff;
        }

        #btn-deactivate {
            background: #eee;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="hamster-icon">🐹</div>
    <h2>Neckster</h2>
    <p class="status" id="status-text"></p>
    <button id="btn-activate">모든 사이트에서 시작하기</button>
    <button id="btn-deactivate" style="display:none; margin-top:8px;">비활성화</button>
    <script src="popup.js"></script>
</body>
</html>
